[package]
name = "sorug-ffi"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
description = "C FFI bindings for the sorug WHATWG URL parser"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/hocestnonsatis/sorug"
homepage = "https://github.com/hocestnonsatis/sorug"
documentation = "https://docs.rs/sorug"
publish = false
keywords = ["url", "ffi", "c", "whatwg"]
categories = ["parser-implementations", "external-ffi-bindings"]

[lib]
name = "sorug_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
sorug = { path = "..", version = "0.5.0" }

[lints.rust]
# C ABI requires `unsafe`; the main `sorug` crate remains `forbid(unsafe_code)`.
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
