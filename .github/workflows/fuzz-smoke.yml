name: Fuzz smoke

on:
  schedule:
    # Daily 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "fuzz/**"
      - ".github/workflows/fuzz-smoke.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke:
    name: fuzz-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "fuzz -> target"
          key: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Parse fuzz smoke (60s)
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run url_fuzz -- \
            -max_total_time=60 \
            -max_len=4096 \
            -rss_limit_mb=2048 \
            -dict=url_dict.txt
      - name: Mutate fuzz smoke (60s)
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run url_mutate_fuzz -- \
            -max_total_time=60 \
            -max_len=4096 \
            -rss_limit_mb=2048
