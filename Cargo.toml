[package]
name = "sorug"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
description = "Ultra-high-performance, zero-copy, WHATWG-compliant URL parser"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/hocestnonsatis/sorug"
homepage = "https://github.com/hocestnonsatis/sorug"
documentation = "https://docs.rs/sorug"
publish = true
keywords = ["url", "parser", "whatwg", "simd", "swar"]
categories = ["parser-implementations", "network-programming", "no-std"]
exclude = [
    "memories.md",
    "target/",
    "ffi/",
    "fuzz/",
    "fuzz/corpus/",
    "fuzz/artifacts/",
    "fuzz/logs/",
    "fuzz/target/",
]

[workspace]
members = [".", "ffi"]
exclude = ["fuzz"]
resolver = "2"

[features]
default = ["std"]
std = ["memchr/std"]
serde = ["dep:serde"]
# `http` crate requires `std` today.
http = ["dep:http", "std"]

[dependencies]
# SIMD-accelerated single/multi-byte delimiter scanning (`:`, `/`, `?`, `#`, …)
memchr = { version = "2.7", default-features = false }
# UTS #46 requires NFC before Punycode (e.g. t + combining cedilla → ţ).
unicode-normalization = { version = "0.1", default-features = false }
serde = { version = "1", optional = true, default-features = false, features = ["alloc"] }
http = { version = "1", optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
criterion = "0.5"
url = "2.5"
ada-url = "4"

[[bench]]
name = "url_benchmark"
harness = false

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
